coordinator=true
node-scheduler.include-coordinator=true
# HTTP interno (discovery/coordinator). NAO publicar essa porta na internet.
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Exposicao publica: HTTPS + autenticacao por senha (file/bcrypt).
# Sem TLS o authenticator PASSWORD nem liga; clientes em HTTP puro sao recusados.
http-server.authentication.type=PASSWORD
http-server.https.enabled=true
http-server.https.port=8443
# Obrigatorio quando auth ligada (Trino 450), mesmo single-node. Valor via env (nao versionado).
# Gerar: openssl rand -hex 32  -> por em .env como TRINO_SHARED_SECRET
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
# PEM unico (chave + cert). Gerado na VM, NAO versionado (ver .gitignore).
http-server.https.keystore.path=/etc/trino/cert/trino.pem
# Memoria p/ heap 5G (m7i-flex.large 8GiB). per-node + headroom < Xmx(5G): 3G+1G=4G OK.
query.max-memory=4GB
query.max-memory-per-node=3GB
memory.heap-headroom-per-node=1GB
